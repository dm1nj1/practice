<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공공데이터 API 호출</title>
</head>
<body>
    <h1>공공데이터 API 호출 테스트</h1>
    <button onclick="fetchData()">데이터 가져오기</button>
    <pre id="output"></pre>

    <script>
        function fetchData() {
            const serviceKey = "K8o8iBUjkQXzuSmJEDOEjZylgMwInbN61Axy1zLGrxNLaefdwwrsOq6p907HnjHAFe4J2JRL0Gx9danDGuH0Xg%3D%3D"; // 본인의 인증키 입력
            const baseDate = "20250305"; // 조회 날짜
            const baseTime = "1100"; // 발표 시각
            const nx = 55; // X 좌표
            const ny = 127; // Y 좌표

            const url = `http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?serviceKey=${serviceKey}&numOfRows=10&pageNo=1&base_date=${baseDate}&base_time=${baseTime}&nx=${nx}&ny=${ny}&dataType=JSON`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("네트워크 응답이 올바르지 않습니다.");
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("공공데이터 API 응답:", data);
                    document.getElementById("output").textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    console.error("데이터 요청 중 오류 발생:", error);
                    document.getElementById("output").textContent = "데이터를 불러오는 중 오류가 발생했습니다.";
                });
        }
        
    </script>
</body>
</html>
